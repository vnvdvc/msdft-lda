[tox]
envlist = py311, py312
isolated_build = true

[testenv]
description = msref test environment
deps =
    pyscf==2.13.1
    pytest
    ruff
    pyyaml
    h5py
commands =
    ruff check src/msref tests/unit tests/integration tests/regression tests/scientific
    pytest -q tests/unit tests/integration/test_pyscf_capabilities.py
